<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Alce Store</title>

    <link rel="stylesheet" href="design.css" />
  </head>

  <body>
    <header class="topo">
      <div class="logo">
        <h1>ALCE STORE</h1>
      </div>

      <div class="pesquisa">
        <input type="text" placeholder="Pesquisar" />
        <button>Buscar</button>
      </div>
    </header>

    <main>
      <section class="destaque">
        <img src="imagenes/faca 1.jpeg" alt="Faca de aço damasco" />

        <div class="texto-destaque">
          <h2>ALCE STORE</h2>

          <p>Precisão e Arte em Aço Damasco.</p>

          <button>VER COLEÇÃO</button>
        </div>
      </section>

      <section class="produtos">
        <h2>TODAS AS FACAS</h2>

        <div class="lista" id="lista-facas"></div>
      </section>
    </main>

    <footer>
      <p>Copyright © 2026 Alce Store</p>

      <a href="#">Política de Privacidade</a>

      <a href="#">Contato</a>
    </footer>

    <script src="faca.js"></script>
  </body>
</html>
