<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes | Alce Store</title>
    <link rel="stylesheet" href="detalhes.css">
</head>
<body>

    <header>
        <h1>ALCE STORE</h1>
        <a href="index.html">Voltar à coleção</a>
    </header>

    <main class="detalhes-container">
        <section class="galeria">
            <div class="imagem-principal">
                <img id="imagem-principal" src="" alt="Imagem do produto">
            </div>

            <div class="miniaturas" id="miniaturas"></div>
        </section>

        <section class="informacoes">
            <h2 id="nome"></h2>
            <p id="descricao"></p>
            <h3 id="preco"></h3>
            <p id="estoque"></p>

            <div id="area-admin" style="display: none;">
                <h3>Adicionar imagens</h3>
                <input type="file" id="novas-imagens" accept="image/*" multiple>
                <button id="botao-adicionar">Adicionar imagens</button>
                <p id="mensagem-admin"></p>
            </div>
        </section>
    </main>

    <script src="detalhes.js"></script>
</body>
</html>
